<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Continuous macOS squircle path [100..924] -->
    <path id="squircle" d="M 340 100 L 684 100 C 842 100, 924 182, 924 340 L 924 684 C 924 842, 842 924, 684 924 L 340 924 C 182 924, 100 842, 100 684 L 100 340 C 100 182, 182 100, 340 100 Z"/>

    <clipPath id="clipSquircle">
      <use href="#squircle"/>
    </clipPath>

    <linearGradient id="bgGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#264775"/>
      <stop offset="52%" stop-color="#192E52"/>
      <stop offset="100%" stop-color="#0F1B33"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="0.22" cy="0.14" r="0.72">
      <stop offset="0%" stop-color="#56B4F9" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#3E7FC9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#192E52" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#B9D7FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040B16" stop-opacity="0.40"/>
    </linearGradient>

    <linearGradient id="backWinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEBFF" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#A8C6ED" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="frontWinGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#E7EFFA" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF9B42"/>
      <stop offset="100%" stop-color="#E65728"/>
    </linearGradient>

    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#060D1A" flood-opacity="0.30"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#071224" flood-opacity="0.32"/>
    </filter>

    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base squircle with soft drop shadow -->
  <use href="#squircle" fill="url(#bgGrad)" filter="url(#tileShadow)"/>

  <g clip-path="url(#clipSquircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#topGlow)"/>

    <!-- Subtle bottom Dock shelf -->
    <rect x="196" y="688" width="632" height="110" rx="34" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Back stacked window -->
    <rect x="236" y="218" width="448" height="352" rx="40" fill="url(#backWinGrad)" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2.5"/>

    <!-- Front crisp window -->
    <g filter="url(#cardShadow)">
      <rect x="304" y="294" width="464" height="368" rx="42" fill="url(#frontWinGrad)"/>
      <rect x="304" y="294" width="464" height="368" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
      <!-- Window traffic light dots and title divider -->
      <circle cx="352" cy="336" r="9.5" fill="#FF6B62" fill-opacity="0.88"/>
      <circle cx="382" cy="336" r="9.5" fill="#FFB946" fill-opacity="0.88"/>
      <circle cx="412" cy="336" r="9.5" fill="#46C96E" fill-opacity="0.88"/>
      <line x1="336" y1="368" x2="736" y2="368" stroke="#1F3659" stroke-opacity="0.10" stroke-width="2.5"/>
      <!-- Subtle content lines -->
      <rect x="348" y="406" width="236" height="22" rx="11" fill="#233E68" fill-opacity="0.14"/>
      <rect x="348" y="452" width="320" height="18" rx="9" fill="#233E68" fill-opacity="0.09"/>
      <rect x="348" y="490" width="268" height="18" rx="9" fill="#233E68" fill-opacity="0.09"/>
    </g>

    <!-- Precision count badge in lower right -->
    <g filter="url(#badgeShadow)">
      <circle cx="728" cy="616" r="98" fill="url(#badgeGrad)"/>
      <circle cx="728" cy="616" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3.5"/>
      <!-- Crisp geometric numeral 3 -->
      <path d="M 700 578 C 708 558, 754 558, 758 586 C 760 606, 742 615, 718 615 C 745 615, 762 626, 760 648 C 756 673, 706 673, 698 652"
            fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Outer rim bevel -->
  <use href="#squircle" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
</svg>
